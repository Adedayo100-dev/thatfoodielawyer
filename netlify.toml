# Netlify config. Leave "Base directory" EMPTY in Netlify's settings (this file sits at the repo root).
# Netlify installs requirements.txt, runs the build (which turns content/posts into blog pages), then publishes /site.
[build]
  command = "pip install -r requirements.txt && python3 src/build.py"
  publish = "site"

[[redirects]]
  from = "/blank-2"
  to = "/consulting"
  status = 301
[[redirects]]
  from = "/consult"
  to = "/consulting"
  status = 301
[[redirects]]
  from = "/blog"
  to = "/ideas"
  status = 301
[[redirects]]
  from = "/blog/*"
  to = "/ideas"
  status = 301
[[redirects]]
  from = "/samples"
  to = "/"
  status = 301
[[redirects]]
  from = "/option-*"
  to = "/"
  status = 301

# Images can be cached for a week; CSS/JS are versioned (?v=) so updates show immediately.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[redirects]]
  from = "/book-*"
  to = "/book"
  status = 301
